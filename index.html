<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }

        .header { width: 100%; padding: 15px 10px; background: lightgray; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; left: 0; }
        
        .title { font-size: 22px; font-weight: bold; color: black; }

        .menu { position: relative; display: inline-block; }
        .menu-btn { padding: 5px 10px; background: black; color: white; border: none; cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .menu-content { display: none; position: absolute; background: white; color: black; width: 180px; right: 0; box-shadow: 2px 2px 8px rgba(0,0,0,0.2); }
        .menu-content a { display: block; padding: 8px; text-decoration: none; color: black; cursor: pointer; }

        .container { padding: 25px; background: #1e1e1e; width: 90%; max-width: 420px; border-radius: 15px; margin-top: 90px; text-align: center; box-shadow: 4px 4px 15px rgba(255, 255, 255, 0.1); }

        h1 { margin-bottom: 15px; }

        .label-text { font-size: 18px; font-weight: bold; margin-bottom: 8px; display: block; }

        .date-picker { display: flex; justify-content: space-between; margin: 10px 0 20px 0; }
        select { padding: 12px; border-radius: 6px; background: #333; color: white; font-size: 14px; text-align: center; width: 32%; }

        button { width: 100%; padding: 12px; background-color: #32cd32; color: white; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; border: none; box-shadow: 3px 3px 8px rgba(0,0,0,0.3); }
        button:hover { background-color: #28a428; }

        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: white; }

        .footer { width: 100%; padding: 10px; background: lightgray; position: fixed; bottom: 0; text-align: center; color: black; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="title" id="header-title">Age Calculator</h2>
        <div class="menu">
            <button class="menu-btn" onclick="toggleMenu()">🌍 Language</button>
            <div class="menu-content" id="language-menu">
                <a onclick="changeLanguage('en')">English</a>
                <a onclick="changeLanguage('bn')">বাংলা</a>
                <a onclick="changeLanguage('hi')">हिन्दी</a>
                <a onclick="changeLanguage('ja')">日本語</a>
                <a onclick="changeLanguage('ko')">한국어</a>
                <a onclick="changeLanguage('zh')">中文</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1 id="main-title">Age Calculator</h1>

        <label id="dob-label" class="label-text">Date of Birth:</label>
        <div class="date-picker">
            <select id="birth-month"></select>
            <select id="birth-day"></select>
            <select id="birth-year"></select>
        </div>

        <label id="current-date-label" class="label-text">Current Date:</label>
        <div class="date-picker">
            <select id="current-month"></select>
            <select id="current-day"></select>
            <select id="current-year"></select>
        </div>

        <button onclick="calculateAge()" id="calculate-btn">Calculate</button>

        <div class="result" id="age-result"></div>
    </div>

    <div class="footer">
        Developed by Deep Deb | © 2025 All Rights Reserved
    </div>

    <script>
        function toggleMenu() {
            let menu = document.getElementById("language-menu");
            menu.style.display = (menu.style.display === "block") ? "none" : "block";
        }

        function populateDropdowns() {
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            let birthMonth = document.getElementById("birth-month");
            let currentMonth = document.getElementById("current-month");

            months.forEach((m, i) => {
                birthMonth.add(new Option(m, i + 1));
                currentMonth.add(new Option(m, i + 1));
            });

            for (let i = 1; i <= 31; i++) {
                document.getElementById("birth-day").add(new Option(i, i));
                document.getElementById("current-day").add(new Option(i, i));
            }

            let thisYear = new Date().getFullYear();
            for (let i = 1925; i <= thisYear; i++) {
                document.getElementById("birth-year").add(new Option(i, i));
                document.getElementById("current-year").add(new Option(i, i));
            }
        }

        function calculateAge() {
            let birthYear = parseInt(document.getElementById("birth-year").value);
            let birthMonth = parseInt(document.getElementById("birth-month").value);
            let birthDay = parseInt(document.getElementById("birth-day").value);
            let currentYear = parseInt(document.getElementById("current-year").value);
            let currentMonth = parseInt(document.getElementById("current-month").value);
            let currentDay = parseInt(document.getElementById("current-day").value);

            let years = currentYear - birthYear;
            let months = currentMonth - birthMonth;
            let days = currentDay - birthDay;

            if (days < 0) { months--; days += new Date(currentYear, currentMonth, 0).getDate(); }
            if (months < 0) { years--; months += 12; }

            document.getElementById("age-result").innerText = `🎉 Your Exact Age: ${years} Years, ${months} Months, ${days} Days`;
        }

        function changeLanguage(lang) {
            let translations = {
                en: { title: "Age Calculator", dob: "Date of Birth:", current: "Current Date:", button: "Calculate" },
                bn: { title: "বয়স গণনা", dob: "জন্ম তারিখ:", current: "বর্তমান তারিখ:", button: "গণনা করুন" },
                hi: { title: "आयु कैलकुलेटर", dob: "जन्म तिथि:", current: "वर्तमान तिथि:", button: "गणना करें" },
            };

            document.getElementById("main-title").innerText = translations[lang].title;
            document.getElementById("dob-label").innerText = translations[lang].dob;
            document.getElementById("current-date-label").innerText = translations[lang].current;
            document.getElementById("calculate-btn").innerText = translations[lang].button;
        }

        populateDropdowns();
    </script>

</body>
</html>
